<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Price Tracker by Prasanth Subrahmanian</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
            padding: 20px;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .developer {
            margin-top: 10px;
            font-style: italic;
            background: rgba(255,255,255,0.2);
            padding: 8px 15px;
            border-radius: 20px;
            display: inline-block;
            backdrop-filter: blur(10px);
        }

        .search-container {
            display: flex;
            justify-content: center;
            margin-bottom: 30px;
        }

        #searchInput {
            padding: 12px 20px;
            width: 300px;
            border: none;
            border-radius: 25px 0 0 25px;
            font-size: 16px;
            outline: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        #searchButton {
            padding: 12px 25px;
            background: #ff6b6b;
            color: white;
            border: none;
            border-radius: 0 25px 25px 0;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        #searchButton:hover {
            background: #ff5252;
        }

        .stats-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: bold;
            color: #333;
            margin-top: 5px;
        }

        .crypto-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .crypto-card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
        }

        .crypto-card:hover {
            transform: translateY(-5px);
        }

        .crypto-header {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }

        .crypto-icon {
            width: 50px;
            height: 50px;
            margin-right: 15px;
            border-radius: 50%;
        }

        .crypto-name {
            font-size: 1.3rem;
            font-weight: bold;
            color: #333;
        }

        .crypto-symbol {
            color: #666;
            margin-left: 10px;
            font-size: 0.9rem;
        }

        .price {
            font-size: 2rem;
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
        }

        .price-change {
            font-size: 1.1rem;
            font-weight: bold;
            padding: 6px 12px;
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 15px;
        }

        .positive {
            background: #d4edda;
            color: #155724;
        }

        .negative {
            background: #f8d7da;
            color: #721c24;
        }

        .market-info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #eee;
        }

        .info-item {
            font-size: 0.9rem;
            color: #666;
        }

        .info-value {
            font-weight: bold;
            color: #333;
            font-size: 0.95rem;
        }

        .loading {
            text-align: center;
            color: white;
            font-size: 1.2rem;
            margin: 50px 0;
        }

        .error {
            text-align: center;
            color: #ff6b6b;
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
        }

        .footer {
            text-align: center;
            color: white;
            margin-top: 40px;
            padding: 20px;
            opacity: 0.8;
        }

        @media (max-width: 768px) {
            .crypto-grid {
                grid-template-columns: 1fr;
            }
            
            #searchInput {
                width: 200px;
            }
            
            .header h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚀 Crypto Price Tracker</h1>
            <p>Real-time cryptocurrency prices and market data</p>
            <div class="developer">by Prasanth Subrahmanian</div>
        </div>

        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Search cryptocurrencies...">
            <button id="searchButton">Search</button>
        </div>

        <div id="statsContainer" class="stats-container">
            <!-- Stats will be loaded here -->
        </div>

        <div id="cryptoContainer" class="crypto-grid">
            <div class="loading">Loading cryptocurrency data...</div>
        </div>

        <div class="footer">
            <p>Data provided by CryptoCompare API • Updated every 2 minutes</p>
        </div>
    </div>

    <script>
        // Using CryptoCompare API which works better with GitHub Pages
        const API_URL = 'https://min-api.cryptocompare.com/data/top/mktcapfull?limit=50&tsym=USD';

        let allCryptos = [];
        let filteredCryptos = [];

        async function fetchCryptoData() {
            try {
                const response = await fetch(API_URL);
                if (!response.ok) throw new Error('Network error');
                const data = await response.json();
                
                // Transform the data to match our format
                const cryptos = data.Data.map(item => {
                    const coin = item.CoinInfo;
                    const raw = item.RAW?.USD || {};
                    
                    return {
                        id: coin.Id,
                        name: coin.FullName,
                        symbol: coin.Name,
                        image: https://www.cryptocompare.com${coin.ImageUrl},
                        current_price: raw.PRICE || 0,
                        market_cap: raw.MKTCAP || 0,
                        total_volume: raw.TOTALVOLUME24HTO || 0,
                        price_change_percentage_24h: raw.CHANGEPCT24HOUR || 0,
                        circulating_supply: raw.SUPPLY || 0,
                        total_supply: raw.SUPPLY || 0
                    };
                });

                allCryptos = cryptos;
                filteredCryptos = cryptos;
                displayStats(cryptos);
                displayCryptos(cryptos);
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('cryptoContainer').innerHTML = 
                    '<div class="error">Loading cryptocurrency data... Please wait</div>';
                
                // Fallback: Try again in 5 seconds
                setTimeout(fetchCryptoData, 5000);
            }
        }

        function displayStats(cryptos) {
            const totalMarketCap = cryptos.reduce((sum, crypto) => sum + crypto.market_cap, 0);
            const totalVolume = cryptos.reduce((sum, crypto) => sum + crypto.total_volume, 0);
            const avgChange = cryptos.reduce((sum, crypto) => sum + (crypto.price_change_percentage_24h || 0), 0) / cryptos.length;
            const gaining = cryptos.filter(crypto => (crypto.price_change_percentage_24h || 0) > 0).length;

            document.getElementById('statsContainer').innerHTML = `
                <div class="stat-card">
                    <div>Total Market Cap</div>
                    <div class="stat-value">$${(totalMarketCap / 1e9).toFixed(1)}B</div>
                </div>
                <div class="stat-card">
                    <div>24h Volume</div>
                    <div class="stat-value">$${(totalVolume / 1e9).toFixed(1)}B</div>
                </div>
                <div class="stat-card">
                    <div>Avg 24h Change</div>
                    <div class="stat-value" style="color: ${avgChange >= 0 ? '#155724' : '#721c24'}">
                        ${avgChange >= 0 ? '+' : ''}${avgChange.toFixed(2)}%
                    </div>
                </div>
                <div class="stat-card">
                    <div>Gaining Coins</div>
                    <div class="stat-value" style="color: #155724">${gaining}/${cryptos.length}</div>
                </div>
            `;
        }

        function displayCryptos(cryptos) {
            const container = document.getElementById('cryptoContainer');
            
            if (cryptos.length === 0) {
                container.innerHTML = '<div class="error">No cryptocurrencies found matching your search.</div>';
                return;
            }

            container.innerHTML = cryptos.map(crypto => `
                <div class="crypto-card">
                    <div class="crypto-header">
                        <img src="${crypto.image}" alt="${crypto.name}" class="crypto-icon" onerror="this.src='https://via.placeholder.com/50'">
                        <div>
                            <span class="crypto-name">${crypto.name}</span>
                            <span class="crypto-symbol">${crypto.symbol.toUpperCase()}</span>
                        </div>
                    </div>
                    
                    <div class="price">$${crypto.current_price?.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2}) || '0.00'}</div>
                    
                    <div class="price-change ${(crypto.price_change_percentage_24h || 0) >= 0 ? 'positive' : 'negative'}">
                        ${(crypto.price_change_percentage_24h || 0) >= 0 ? '↗' : '↘'} 
                        ${Math.abs(crypto.price_change_percentage_24h || 0).toFixed(2)}%
                    </div>
                    
                    <div class="market-info">
                        <div class="info-item">
                            Market Cap: <span class="info-value">$${crypto.market_cap ? (crypto.market_cap / 1e9).toFixed(2) + 'B' : 'N/A'}</span>
                        </div>
                        <div class="info-item">
                            24h Volume: <span class="info-value">$${crypto.total_volume ? (crypto.total_volume / 1e6).toFixed(2) + 'M' : 'N/A'}</span>
                        </div>
                        <div class="info-item">
                            Price Change: <span class="info-value" style="color: ${(crypto.price_change_percentage_24h || 0) >= 0 ? '#155724' : '#721c24'}">
                                ${(crypto.price_change_percentage_24h || 0) >= 0 ? '+' : ''}${(crypto.price_change_percentage_24h || 0).toFixed(2)}%
                            </span>
                        </div>
                        <div class="info-item">
                            Symbol: <span class="info-value">${crypto.symbol.toUpperCase()}</span>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function filterCryptos(searchTerm) {
            const term = searchTerm.toLowerCase();
            filteredCryptos = allCryptos.filter(crypto => 
                crypto.name.toLowerCase().includes(term) || 
                crypto.symbol.toLowerCase().includes(term)
            );
            displayStats(filteredCryptos);
            displayCryptos(filteredCryptos);
        }

        // Event listeners
        document.getElementById('searchButton').addEventListener('click', () => {
            const searchTerm = document.getElementById('searchInput').value;
            filterCryptos(searchTerm);
        });

        document.getElementById('searchInput').addEventListener('input', (e) => {
            filterCryptos(e.target.value);
        });

        document.getElementById('searchInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                filterCryptos(e.target.value);
            }
        });

        // Auto-refresh data every 2 minutes
        setInterval(fetchCryptoData, 120000);

        // Initial load
        fetchCryptoData();
    </script>
</body>
</html>
